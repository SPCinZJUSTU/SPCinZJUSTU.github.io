profile:
  en: >-
    PhD researcher in microwave metasurfaces with hands-on experience in planar
    microwave device simulation, magnetic semiconductor metamaterial modeling,
    RF test automation, and PCB fabrication. Proficient in CST Studio Suite
    full-wave simulation, capable of independently building VNA measurement
    systems, and familiar with microwave substrate selection and fabrication
    constraints up to 20 GHz.
  cn: >-
    微波超表面博士研究生，具备平面微波器件仿真、磁性半导体超材料建模、射频测试自动化及PCB工艺的项目经验。
    熟悉CST Studio Suite全波仿真流程，能够独立完成VNA测量系统搭建，20 GHz以内微波板材选型与加工约束。

