projects:
  - title:
      en: "Planar Microwave Filter & Waveguide Device Simulation"
      cn: "平面微波滤波器与波导器件仿真"
    subtitle:
      en: "CST Studio Suite · Electromagnetic Simulation"
      cn: "CST Studio Suite · 电磁仿真"
    date: "Mar 2021 – Sep 2023"
    bullets:
      en:
        - >-
          Modeled and optimized S-parameters of microstrip bandpass filters in CST;
          compared Butterworth and Chebyshev responses in passband flatness and
          roll-off to determine the design meeting specifications.
        - >-
          Established a mapping flow between equivalent circuits and physical
          dimensions for ridge gap waveguide low-pass filters and split-ring
          resonator arrays; verified return loss and insertion loss in X-band.
      cn:
        - >-
          基于CST完成微带带通滤波器的建模与S参数优化，对比Butterworth与Chebyshev响应在通带平坦度
          与滚降速度上的差异，确定满足指标的设计方案。
        - >-
          建立脊间隙波导低通滤波器和开口谐振环阵列等效电路与物理尺寸的映射流程，
          在X波段验证回波损耗与插入损耗指标。

  - title:
      en: "Network Analyzer (Agilent E5070) Control Programming"
      cn: "网络分析仪（Agilent E5070）使用程序编写"
    subtitle:
      en: "Agilent E5070 · Instrument Control & Data Acquisition"
      cn: "Agilent E5070 · 仪器控制与数据采集"
    date: "Jun 2022 – Aug 2022"
    bullets:
      en:
        - >-
          Developed control programs for the E5070 network analyzer, enabling
          instrument parameter configuration, S-parameter acquisition, and
          result export.
        - >-
          Debugged and integrated the program with the instrument, improving
          automation and repeatability of RF testing.
      cn:
        - >-
          编写网络分析仪E5070的使用与控制程序，实现仪器参数配置、S参数采集与结果导出等功能。
        - >-
          完成程序调试与仪器联调，提升射频测试的自动化程度与重复性。

  - title:
      en: "Microwave PCB Design & Fabrication (including PCB Engraver Operation & Maintenance)"
      cn: "微波PCB设计与加工（含PCB雕刻机使用与维护）"
    subtitle:
      en: "LPKF PCB Engraver · RF PCB Process"
      cn: "乐普科雕板机 · 射频PCB工艺"
    date: "Sep 2022 – Aug 2024"
    bullets:
      en:
        - >-
          Operated PCB engraver daily, including parameter setup and machining;
          performed spindle maintenance, tool replacement, and platform
          calibration; troubleshot common faults and maintained logs.
        - >-
          Completed filter layout design, controlling line width tolerance and
          impedance design to ensure simulation-measurement comparability.
        - >-
          Familiar with standard PCB processes (cutting → patterning → lamination
          → drilling → copper deposition → solder mask → surface finish →
          testing); aware of RF substrate parameters and copper foil roughness
          effects on insertion loss.
      cn:
        - >-
          负责PCB雕刻机的日常操作、参数设置与加工流程执行，执行主轴保养、刀具更换、
          平台校准等定期维护，排查常见故障并记录维护日志。
        - >-
          完成滤波器版图绘制，控制线宽公差与阻抗设计，保证仿真与实测的可对比性。
        - >-
          了解PCB标准工艺流程（开料→图形→压合→钻孔→沉铜→防焊→表面处理→测试），
          关注射频板材参数与铜箔粗糙度对插损的影响。

  - title:
      en: "Optical Table Laboratory Design & Setup"
      cn: "光学平台实验室设计搭建"
    subtitle:
      en: "Optical Table · Lab Construction"
      cn: "光学平台 · 实验室建设"
    date: "Feb 2023 – May 2023"
    bullets:
      en:
        - >-
          Participated in layout design and construction of the optical table lab,
          including vibration isolation platform, optical path layout, power
          supply, and cabling.
        - >-
          Coordinated equipment delivery, installation, and commissioning to
          ensure the lab met subsequent experimental requirements.
      cn:
        - >-
          参与光学平台实验室布局设计与搭建，完成隔振平台、光路布局、供电与走线等基础环境建设。
        - >-
          协调设备进场、安装与调试，确保实验室满足后续实验需求。

  - title:
      en: "FTP-based Lab Data Storage & Transfer System"
      cn: "基于FTP的实验室数据储存与传输系统搭建"
    subtitle:
      en: "FTP · Data Management"
      cn: "FTP · 数据管理"
    date: "May 2023 – Jun 2023"
    bullets:
      en:
        - >-
          Built an FTP-based lab data storage and transfer system; configured
          server, user permissions, and directory structure for centralized
          experiment data management and sharing.
        - >-
          Established data backup and transfer protocols to improve data security
          and team collaboration efficiency.
      cn:
        - >-
          搭建基于FTP协议的实验室数据存储与传输系统，配置服务器、用户权限与目录结构，
          实现实验数据集中管理与共享。
        - >-
          制定数据备份与传输规范，提升数据安全性与团队协作效率。

  - title:
      en: "3D Motion Platform LabVIEW Programming"
      cn: "三维移动平台LabVIEW程序编写"
    subtitle:
      en: "LabVIEW · Motion Control"
      cn: "LabVIEW · 运动控制"
    date: "Jun 2023 – Sep 2023"
    bullets:
      en:
        - >-
          Developed LabVIEW programs for 3D motion platform control, implementing
          motion control, parameter configuration, and data acquisition.
        - >-
          Debugged and integrated the program, improving automation of platform
          operations.
      cn:
        - >-
          使用LabVIEW编写三维移动平台控制程序，实现运动控制、参数配置与数据采集等功能。
        - >-
          完成程序调试与联调，提升平台操作的自动化程度。

  - title:
      en: "Magnetic Semiconductor Isolator Fabrication & Testing"
      cn: "磁性半导体隔离器加工测试"
    subtitle:
      en: "CST Studio Suite · Anisotropic Material Modeling"
      cn: "CST Studio Suite · 各向异性材料建模"
    date: "Oct 2024 – Present"
    bullets:
      en:
        - >-
          Distinguished physical differences between ferrite gyromagnetic models
          and magnetic semiconductor gyroelectric models; established gyroelectric
          permittivity tensor using Anisotropic Dielectric material type in CST
          to avoid errors from applying ferrite templates.
        - >-
          Based on YIG nonreciprocal effects and microwave metamaterial
          nonreciprocal research, completed a scientific paper.
      cn:
        - >-
          区分铁氧体旋磁模型与磁性半导体旋电模型的物理差异，在CST中以Anisotropic
          Dielectric材料类型建立旋电介电常数张量，避免套用铁氧体模板导致误差。
        - >-
          基于YIG材料的非互易效应和微波超材料非互易相关研究，完成科研论文。

  - title:
      en: "RF / Microwave Test System Setup & Automation"
      cn: "射频微波测试系统搭建与自动化"
    subtitle:
      en: "VNA · Oscilloscope · PyVISA / SCPI"
      cn: "VNA · 示波器 · PyVISA / SCPI"
    date: "Oct 2024 – Dec 2025"
    bullets:
      en:
        - >-
          Built a synchronized oscilloscope-VNA test environment supporting joint
          time-domain and frequency-domain observation; compiled automated
          measurement scripts for lab reuse.
      cn:
        - >-
          搭建示波器与VNA联动的测试环境，支持时域与频域联合观测，整理自动化测量脚本供实验室复用。

  - title:
      en: "PhD Research: Metamaterials & Paper Writing"
      cn: "博士课题：超材料方向研究与论文撰写"
    subtitle:
      en: "Metamaterials · Microwave Nonreciprocal Devices"
      cn: "超材料 · 微波非互易器件"
    date: "2024 – Dec 2025"
    bullets:
      en:
        - >-
          Conducted PhD research on metamaterials, including experimental design,
          data analysis, and paper writing.
        - >-
          Combined YIG nonreciprocal effects with microwave metamaterial research
          to complete scientific papers.
      cn:
        - >-
          围绕超材料方向开展博士课题研究，完成实验设计、数据分析与论文撰写。
        - >-
          结合YIG材料非互易效应与微波超材料研究，完成相关科研论文。

  - title:
      en: "PhD Dissertation Writing & Manuscript Revision"
      cn: "博士论文撰写及小论文回稿"
    subtitle:
